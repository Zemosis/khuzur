# RENDER BLUEPRINT — the game server and the website, both free tier.
#
# The database is Supabase (see docs/ARCHITECTURE.md), so DATABASE_URL is a
# secret filled in on Render, not a Render database. The server sits in Ohio,
# next to the Supabase pooler (us-east-2). If Render gives either service a
# different onrender.com address than its name, update CORS_ORIGIN and
# VITE_WEBSOCKET_URL to match.

services:
  # Socket.IO game server + account API. Runs its migrations on start.
  - type: web
    name: khuzur-server
    runtime: node
    plan: free
    region: ohio
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Supabase session pooler URL, with ?sslmode=require&uselibpqcompat=true
      - key: ADMIN_USER_IDS
        sync: false # comma-separated user ids that may open /admin (credits review)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://khuzur.onrender.com
      # Google / Discord sign in (server/oauth.js); a button shows only when
      # both its id and secret are set. Players come back to
      # RENDER_EXTERNAL_URL/api/auth/oauth/<provider>/callback and land on the
      # first CORS_ORIGIN.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

  # The React app, served from Render's CDN.
  - type: web
    name: khuzur
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      ignoredPaths:
        - server/**
        - docs/**
        - tests/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_WEBSOCKET_URL
        value: https://khuzur-server.onrender.com
    # Every path is the app: /game-13, /profile, /join/CODE ...
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
